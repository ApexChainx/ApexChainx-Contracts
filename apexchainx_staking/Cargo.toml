[package]
name = "apexchainx_staking"
version = "0.1.0"
edition = "2021"
description = "Soroban staking contract for the ApexChainx system"
license = "MIT"
repository = "https://github.com/ApexChainx/ApexChainx-Contracts"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
soroban-sdk = { version = "21.1.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "21.1.0", features = ["testutils", "alloc"] }
