# =============================================================================
# ApexChainx Contracts — Security Audit (weekly schedule only)
# =============================================================================
#
# Runs cargo-audit against the RustSec Advisory Database every Monday.
# Dependency scanning is important but doesn't need to block every PR;
# weekly cadence catches newly published advisories in a timely manner.
# =============================================================================

name: Security Audit

# CI temporarily disabled – triggers commented out below.
# on:
#   schedule:
#     - cron: '0 8 * * 1'  # Every Monday 08:00 UTC

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # cargo-audit >= 0.22 dropped the `--manifest-path` flag; it reads the
      # `Cargo.lock` in the working directory (repo root holds the workspace
      # lockfile), which is also what the workspace `Cargo.lock` represents.
      - name: Run cargo audit
        run: cargo audit

  deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # `cargo-deny` does not accept cargo's `--all-features` flag (rejected by
      # recent versions); the crate has no features, so plain `cargo deny check`
      # enforces the full advisories/licenses/bans/sources policy from deny.toml.
      - name: Run cargo deny
        run: cargo deny check
